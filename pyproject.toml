[project]
name = "comfyui-booru-prompt-gallery"
version = "0.1.0"
description = "Nodes for Booru Prompt Gallery. The first feature lets the gallery website send prompts to this ComfyUI."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/Mexes-GM/comfyui-booru-prompt-gallery"

[tool.comfy]
PublisherId = ""
DisplayName = "Booru Prompt Gallery"
Icon = ""

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: starts an isolated ComfyUI process"]
