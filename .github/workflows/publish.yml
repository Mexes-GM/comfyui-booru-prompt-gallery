# Publishes the version in pyproject.toml to the ComfyUI registry.
# It works once [tool.comfy] PublisherId is set and the repository has a
# REGISTRY_ACCESS_TOKEN secret. Run it by hand from the Actions tab.
name: Publish to Comfy registry

on:
  workflow_dispatch:

jobs:
  publish-node:
    name: Publish custom node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main, 2026-11-27
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
